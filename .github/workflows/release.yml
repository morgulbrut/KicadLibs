name: Release PCM package

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build PCM package
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: ./make-release.sh "$TAG_NAME"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/kicadlibs.zip

      - name: Commit updated repository metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update PCM repository metadata for ${{ github.event.release.tag_name }}"
          branch: main
          file_pattern: metadata.json packages.json repository.json resources.zip
